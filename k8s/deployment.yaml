apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelnet-deployment
  namespace: default
  labels:
    app: sentinelnet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelnet
  template:
    metadata:
      labels:
        app: sentinelnet
    spec:
      containers:
      - name: sentinelnet-api
        image: strengthftw/network-security:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_DB_URL
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-url
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
